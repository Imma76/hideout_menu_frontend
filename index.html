      name="twitter:title"

  <body>

         no JS to function. -->
    <main class="landing-view">
      <img class="landing-bg" src="assets/bg2.jpg" alt="" />
      <div class="landing-overlay"></div>
      <div class="landing-content">

          class="logo"
          src="assets/logo.webp"
          alt="The Hideout — Bistro &amp; Lake-side Lounge by Lastdrop"
        />
        <p class="tagline">Our Menu</p>

        <nav class="section-picker" aria-label="Menu sections">
          <a class="section-card" href="food.html">
            <img src="assets/food.webp" alt="Food" />
          </a>
          <a class="section-card" href="drinks.html">
            <img src="assets/drinks.webp" alt="Drinks" />
          </a>
          <a class="section-card" href="smoke.html">
